// Charge les pages Supabase en parallèle par petits lots au lieu de les demander une par une.
async function allServices(){
 const countResult=await sb.from('services').select('id',{count:'exact',head:true});
 if(countResult.error)return {data:null,error:countResult.error};
 const total=countResult.count||0,pageSize=1000,all=new Array(total);
 for(let base=0;base<total;base+=6000){
  const jobs=[];
  for(let start=base;start<Math.min(base+6000,total);start+=pageSize){
   jobs.push(sb.from('services').select('*').order('day').order('start_time').order('id').range(start,Math.min(start+pageSize-1,total-1)));
  }
  const results=await Promise.all(jobs);
  for(let i=0;i<results.length;i++){
   if(results[i].error)return {data:null,error:results[i].error};
   const start=base+i*pageSize;
   (results[i].data||[]).forEach((item,j)=>{all[start+j]=item});
  }
 }
 return {data:all.filter(Boolean),error:null};
}
async function load(){
 const r=await Promise.all([sb.from('lines').select('*').order('code'),sb.from('stops').select('*').order('pos'),allServices(),sb.from('messages').select('*').order('created_at').limit(100),sb.from('profiles').select('id,prenom,nom,matricule,role,approved'),sb.from('vehicles').select('*').order('fleet_number')]);
 const e=r.find(x=>x.error);if(e)toast(e.error.message);
 L=r[0].data||[];ST=r[1].data||[];SV=r[2].data||[];MG=r[3].data||[];PR=Object.fromEntries((r[4].data||[]).map(p=>[p.id,p]));VEH=r[5].data||[];
}
async function enter(id){
 let{data}=await sb.from('profiles').select('*').eq('id',id).maybeSingle();
 if(!data){await new Promise(r=>setTimeout(r,800));data=(await sb.from('profiles').select('*').eq('id',id).maybeSingle()).data}
 me=data||{id,prenom:'',nom:'',role:'driver'};if(!me.approved){render();return}await load();subscribe();render();
}
function subscribe(){
 if(live)return;live=true;
 sb.channel('live').on('postgres_changes',{event:'*',schema:'public',table:'messages'},async()=>{
  MG=(await sb.from('messages').select('*').order('created_at').limit(100)).data||[];if(view()==='messages')paintMsgs()})
 .on('postgres_changes',{event:'*',schema:'public',table:'services'},payload=>{
  // La ligne reçue suffit : ne jamais recharger les 35 000 services pour une seule modification.
  const item=payload.new&&payload.new.id?payload.new:null,old=payload.old&&payload.old.id?payload.old:null;
  if(payload.eventType==='DELETE'&&old)SV=SV.filter(x=>x.id!==old.id);
  else if(item){const i=SV.findIndex(x=>x.id===item.id);if(i>=0)SV[i]=item;else SV.push(item)}
  clearTimeout(serviceSyncTimer);serviceSyncTimer=setTimeout(()=>{if(me&&!$('#dlg').open&&view()!=='messages')render()},350);
 }).subscribe();
}

function authView(){
 const su=amode==='signup';$('#nav').style.display='none';document.body.classList.remove('in');
 $('#app').innerHTML=`<div class="au card"><h1>${su?'Créer un compte':'Connexion à LogiRide'}</h1><p class="sub">${su?'Rejoins ton centre bus.':'Connecte-toi à ton espace conducteur LogiRide.'}</p><form id="af" novalidate>${su?'<div class="two"><label>Prénom<input id="fp" autocomplete="given-name"></label><label>Nom<input id="fn" autocomplete="family-name"></label></div><label>Matricule<input id="fm" placeholder="ex. LSTCXXX (il sera vérifié)"></label>':''}<label>E-mail<input id="fe" type="email" placeholder="ex. xyz@exemple.com (il servira en cas de problème)" autocomplete="username"></label><label>Mot de passe<input id="fw" type="password" autocomplete="${su?'new-password':'current-password'}"></label>${su?'<label>Confirmer le mot de passe<input id="fc" type="password" autocomplete="new-password"></label>':''}<p class="err" id="er" role="alert"></p><button class="btn p" style="width:100%">${su?'Créer mon compte':'Se connecter'}</button></form><p class="sub" style="margin:16px 0 0;text-align:center">${su?'Déjà un compte ?':'Pas encore de compte ?'} <button class="sw" id="sw">${su?'Se connecter':'Créer un compte'}</button></p></div>`;
 $('#app').insertAdjacentHTML('beforeend',FOOT);
 $('#sw').onclick=()=>{amode=su?'login':'signup';authView()};
 $('#af').onsubmit=async e=>{
  e.preventDefault();const er=m=>$('#er').textContent=m,email=$('#fe').value.trim(),pw=$('#fw').value;
  if(!email||!pw)return er('Renseigne ton e-mail et ton mot de passe.');
  if(su){
   const p=$('#fp').value.trim(),n=$('#fn').value.trim(),m=$('#fm').value.trim();
   if(!p||!n||!m)return er('Renseigne ton prénom, ton nom et ton matricule.');
   if(pw.length<8)return er('Le mot de passe doit contenir au moins 8 caractères.');
   if(pw!==$('#fc').value)return er('Les deux mots de passe sont différents.');
   const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{prenom:p,nom:n,matricule:m}}});
   if(error)return er(error.message);
   if(!data.session){amode='login';authView();$('#er').textContent='Compte créé. Confirme ton e-mail, puis connecte-toi : ton compte devra ensuite être validé par un administrateur.';return}
   await enter(data.user.id);
  }else{
   const{data,error}=await sb.auth.signInWithPassword({email,password:pw});
   if(error)return er('Identifiants incorrects ou e-mail non confirmé.');
   await enter(data.user.id);
  }
 };
}

const mstart=o=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return d};
const mlabel=d=>{const s=d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'});return s[0].toUpperCase()+s.slice(1)};
const mnav=(k,o)=>`<div class="row mnav"><button class="btn" data-${k}="-1" aria-label="Mois précédent">‹</button><b>${mlabel(mstart(o))}</b><button class="btn" data-${k}="1" aria-label="Mois suivant">›</button></div>`;
const myM=o=>{const d=mstart(o),y=d.getFullYear(),m=d.getMonth();return SV.filter(s=>{if(s.driver_id!==me.id)return false;const t=at(s.day,s.start_time);return t.getFullYear()===y&&t.getMonth()===m}).sort((a,b)=>(a.day+a.start_time).localeCompare(b.day+b.start_time))};
function planning(){
 const d=mstart(pmo),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate(),off=(d.getDay()+6)%7,c=[];
 for(let i=0;i<off;i++)c.push('<div></div>');
 for(let k=1;k<=n;k++){const dt=iso(new Date(y,m,k)),l=SV.filter(s=>s.day===dt&&s.driver_id===me.id);
  c.push(`<div class="day ${dt===today()?'td':''}"><div class="dn">${k}</div>${l.map(s=>`<div class="chip" tabindex="0" data-id="${esc(s.id)}">${lb(s.line_code)}<span>${hm(s.start_time)}–${hm(s.end_time)}</span></div>`).join('')}</div>`)}
 return `<h1>Planning</h1><p class="sub">Tes services du mois.</p><div style="margin-bottom:14px">${mnav('mp',pmo)}</div><div class="card scr"><div class="cal">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="h">${x}</div>`).join('')}${c.join('')}</div></div>`;
}

const dur=s=>(tmin(s.end_time)-tmin(s.start_time)+1440)%1440;
const fh=m=>Math.floor(m/60)+' h '+String(m%60).padStart(2,'0');
const fh2=m=>m%60?`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}`:`${m/60} h`;
function hours(){
 const now=new Date(),mm=now.getMonth(),yy=now.getFullYear();
 const my=SV.filter(s=>s.driver_id===me.id),done=my.filter(s=>endOf(s)<=now);
 const sum=a=>a.reduce((t,s)=>t+dur(s),0);
 return{mois:sum(done.filter(s=>{const d=at(s.day,s.start_time);return d.getMonth()===mm&&d.getFullYear()===yy})),total:sum(done),venir:sum(my.filter(s=>endOf(s)>now))};
}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
const isFerie=ds=>{const y=+ds.slice(0,4);if(['01-01','05-01','05-08','07-14','08-15','11-01','11-11','12-25'].includes(ds.slice(5)))return true;const e=easter(y);return[1,39,50].some(n=>iso(new Date(y,e.getMonth(),e.getDate()+n))===ds)};
const isDim=ds=>{const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d).getDay()===0};
const nuit=s=>{const a=tmin(s.start_time),b=a+dur(s),ov=(x,y)=>Math.max(0,Math.min(b,y)-Math.max(a,x));return ov(-180,360)+ov(1260,1800)};
function heures(){
 const d=mstart(hmo),y=d.getFullYear(),m=d.getMonth(),now=new Date(),inM=myM(hmo),my=SV.filter(s=>s.driver_id===me.id);
 const sum=a=>a.reduce((t,s)=>t+dur(s),0),tot=sum(inM),done=sum(inM.filter(s=>endOf(s)<=now));
 const form=sum(inM.filter(s=>/formation/i.test(s.detail||''))),nt=inM.reduce((t,s)=>t+nuit(s),0);
 const fs=inM.filter(s=>isDim(s.day)||isFerie(s.day)),fj=new Set(fs.map(s=>s.day)).size;
 const days=[...new Set(inM.map(s=>s.day))];
 const f0=new Date(y,m,1);f0.setDate(1-((f0.getDay()+6)%7));
 const wk=[];for(let w=new Date(f0);w<=new Date(y,m+1,0);w.setDate(w.getDate()+7)){const a=iso(w),e=new Date(w);e.setDate(e.getDate()+6);const b=iso(e);wk.push({a,b,h:sum(my.filter(s=>s.day>=a&&s.day<=b))})}
 return `<h1>Mes heures</h1><p class="sub">Tes heures de service, jour par jour et semaine par semaine.</p>
 <div class="row noprint" style="justify-content:space-between;margin-bottom:12px">${mnav('mh',hmo)}<div class="row"><button class="btn" id="csv">⭳ CSV</button><button class="btn" id="prt">⎙ Imprimer / PDF</button></div></div>
 <p class="sub" style="font-size:13px">Chaque service compte de la prise de service à la fin de service ; les formations comptent aussi, formateur compris. Nuit : part entre 21 h et 6 h.</p>
 <div class="kpi"><div><small>Total du mois</small><b>${fh2(tot)}</b><span>${fh2(done)} effectuées · ${fh2(tot-done)} à venir</span></div><div><small>Services</small><b>${inM.length}</b><span>${fh2(tot)}</span></div><div><small>Formations</small><b>${fh2(form)}</b><span>formateur compris</span></div><div><small>Nuit</small><b>${fh2(nt)}</b><span>de 21 h à 6 h</span></div><div><small>Dimanches et fériés</small><b>${fh2(sum(fs))}</b><span>${fj} jour${fj>1?'s':''} travaillé${fj>1?'s':''}</span></div><div><small>Congés</small><b>0</b><span>jour</span></div></div>
 <div class="hgrid"><div class="card"><h2>Jour par jour</h2>${days.length?days.map(dd=>{const l=inM.filter(s=>s.day===dd);return `<div class="jr"><b class="jd">${fd(dd)}</b><div class="jl">${l.map(s=>`<div class="js" tabindex="0" data-id="${esc(s.id)}"><span>🚌</span><span>Service <b>${esc(s.id)}</b> · ligne ${esc(s.line_code)} · ${hm(s.start_time)}–${hm(s.end_time)}</span><small>${fh2(dur(s))}</small></div>`).join('')}</div><b class="jt">${fh2(sum(l))}</b></div>`}).join(''):'<p class="sub">Aucun service ce mois-ci.</p>'}</div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2>Semaines</h2><span class="mu">règle : 48 h au plus</span></div>${wk.map(w=>`<div class="wk"><div><b>Semaine du ${fd(w.a)}</b><small>au ${fd(w.b)}</small></div><div class="row" style="flex-wrap:nowrap;gap:10px"><div class="bar"><i style="width:${Math.min(100,w.h/28.8)}%;background:${w.h>2880?'var(--rd)':'var(--ok)'}"></i></div><b>${fh2(w.h)}</b></div></div>`).join('')}</div></div>`;
}
function equipe(){
 const d=mstart(omo),y=d.getFullYear(),m=d.getMonth(),n=new Date(y,m+1,0).getDate(),off=(d.getDay()+6)%7,c=[];
 for(let i=0;i<off;i++)c.push('<div></div>');
 for(let k=1;k<=n;k++){
  const dt=iso(new Date(y,m,k));
  const dayServices=SV.filter(s=>s.day===dt&&s.driver_id&&PR[s.driver_id]?.approved&&(PR[s.driver_id]?.role==='driver'||PR[s.driver_id]?.role==='admin'))
   .sort((a,b)=>a.start_time.localeCompare(b.start_time));
  const byDriver=new Map();
  dayServices.forEach(s=>{if(!byDriver.has(s.driver_id))byDriver.set(s.driver_id,[]);byDriver.get(s.driver_id).push(s)});
  const blocks=[...byDriver.entries()].map(([id,items])=>{
   const p=PR[id]||{};
   return `<div class="teamday"><b>${esc((p.prenom+' '+p.nom).trim()||p.matricule||'Conducteur')}</b>${items.map(s=>`<div class="chip" tabindex="0" data-id="${esc(s.id)}">${lb(s.line_code)}<span>${hm(s.start_time)}–${hm(s.end_time)}</span></div>`).join('')}</div>`;
  }).join('');
  c.push(`<div class="day ${dt===today()?'td':''}"><div class="dn">${k}</div>${blocks||'<span class="mu">—</span>'}</div>`);
 }
 const monthTotal=SV.filter(s=>s.driver_id&&PR[s.driver_id]?.approved&&(PR[s.driver_id]?.role==='driver'||PR[s.driver_id]?.role==='admin')&&new Date(s.day+'T12:00').getFullYear()===y&&new Date(s.day+'T12:00').getMonth()===m).length;
 return `<h1>Planning de l’équipe</h1><p class="sub">Services prévus de toute l’équipe pour le mois sélectionné. Sélectionne un service pour ouvrir sa fiche.</p><div class="row" style="justify-content:space-between;margin-bottom:12px">${mnav('mo',omo)}<span class="mu">${monthTotal} service(s) planifié(s)</span></div><div class="card scr"><div class="cal">${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(x=>`<div class="h">${x}</div>`).join('')}${c.join('')}</div></div><p class="mu">Les services sans conducteur attribué ne sont pas affichés. Les services des administrateurs ayant une vacation attribuée sont également affichés.</p>`;
}
function classement(){
 const d=mstart(rmo),y=d.getFullYear(),m=d.getMonth();
 const drivers=Object.values(PR).filter(p=>p.approved&&(p.role==='driver'||p.role==='admin'));
 const scores=drivers.map(p=>{
  const services=SV.filter(s=>s.driver_id===p.id&&new Date(s.day+'T12:00').getFullYear()===y&&new Date(s.day+'T12:00').getMonth()===m);
  const minutes=services.reduce((sum,s)=>sum+plan(s).cond,0);
  return {p,minutes,count:services.length};
 }).sort((a,b)=>b.minutes-a.minutes||a.p.nom.localeCompare(b.p.nom));
 const max=Math.max(1,...scores.map(x=>x.minutes));

// Temps de trajet par ligne : [durée d'une course (aller ou retour), repos au terminus] en minutes
const trj=l=>{const T=TRAJ[String(l.code).toUpperCase()]||[10,5];return[Number.isInteger(l.course_min)&&l.course_min>0?l.course_min:T[0],Number.isInteger(l.repos_min)&&l.repos_min>=0?l.repos_min:T[1]]};
const TRAJ={A:[10,5],B:[10,5],C:[6,5],D:[8,5],E:[15,5],NT1:[10,5],NT2:[10,5],NT3:[6,5],NT4:[8,5],NT5:[15,5]};
const ft=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dm=d=>d<60?d+' min':Math.floor(d/60)+' h '+String(d%60).padStart(2,'0');
const hh=d=>Math.floor(d/60)+':'+String(d%60).padStart(2,'0');
const dlong=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

function plan(s){
 const l=L.find(x=>x.code===s.line_code)||{},ta=l.terminus_a||'Terminus A',tb=l.terminus_b||'Terminus B';
 const pts=[ta,...ST.filter(x=>x.line_code===s.line_code).map(x=>x.name),tb];
 const[cd,bt]=trj({code:s.line_code,course_min:l.course_min,repos_min:l.repos_min});
 const t0=tmin(s.start_time),tot=dur(s)||1440,A=tot-PREP-HLP_OUT-HLP_IN-FIN;
 const n=Math.max(1,Math.floor((A+bt)/(cd+bt))),extra=Math.max(0,A-(n*cd+(n-1)*bt));
 const st=[];let t=t0;
 const add=(o,d)=>{o.a=t;o.b=t+d;o.d=d;if(o.k==='hlp')o.stops=[{name:o.from,t:o.a},{name:o.to,t:o.b}];st.push(o);t+=d};
 add({k:'prep',label:'Prise de service',sub:'Préparation du véhicule',from:DEPOT,to:DEPOT},PREP);
 add({k:'hlp',label:'Haut-le-pied',sub:`${DEPOT} → ${ta}`,from:DEPOT,to:ta},HLP_OUT);
 for(let i=1;i<=n;i++){
  const sens=i%2?'A':'R',pp=sens==='A'?pts:[...pts].reverse(),a=t,e=pp[pp.length-1];
  add({k:'course',n:i,sens,label:`Course ${i}`,from:pp[0],to:e,sub:`${pp[0]} → ${e}`,stops:pp.map((nm,j)=>({name:nm,t:a+Math.round(j*cd/Math.max(1,pp.length-1))}))},cd);
  if(i<n)add({k:'batt',label:'Battement',sub:'au terminus',from:e,to:e},bt);
 }
 const lt=st[st.length-1].to;
 if(extra>0)add({k:'batt',label:'Battement',sub:'au terminus',from:lt,to:lt},extra);
 add({k:'hlp',label:'Haut-le-pied',sub:`${lt} → ${DEPOT}`,from:lt,to:DEPOT},HLP_IN);
 add({k:'fin',label:'Fin de service',sub:'Remisage du véhicule',from:DEPOT,to:DEPOT},FIN);
 const cs=st.filter(x=>x.k==='course'),hs=st.filter(x=>x.k==='hlp');
 let run=0,mx=0;st.forEach(x=>{if(x.k==='course'||x.k==='hlp'){run+=x.d;mx=Math.max(mx,run)}else if(x.k==='batt')run=0});
 return{st,l,ta,tb,t0,tot,n,cs,hlpOut:hs[0],hlpIn:hs[1],first:cs[0],last:cs[cs.length-1],
  cond:n*cd+HLP_OUT+HLP_IN,batt:(n-1)*bt+extra,ann:PREP+FIN,mx};
}

const DR={};
function drs(id){if(!DR[id]){let v=null;try{v=JSON.parse(localStorage.getItem('lr-dr-'+id))}catch(e){}DR[id]=v||{n:0,delay:0,log:[]}}return DR[id]}
const drsave=id=>{try{localStorage.setItem('lr-dr-'+id,JSON.stringify(DR[id]))}catch(e){}};
const mv=x=>x&&(x.k==='hlp'||x.k==='course');
const bigOf=x=>x.k==='prep'?`Prise de service à ${ft(x.a)}`:x.k==='hlp'?`${x.to===DEPOT?'Retour au dépôt':'Sortie du dépôt'} à ${ft(x.a)}`:x.k==='course'?`Départ course ${x.n} à ${ft(x.a)}`:x.k==='batt'?`Battement jusqu’à ${ft(x.b)}`:`Fin de service à ${ft(x.a)}`;
const btnOf=x=>x.k==='prep'?'Prise de service':x.k==='hlp'?(x.to===DEPOT?'Retour au dépôt':'Sortie du dépôt'):x.k==='course'?`Départ course ${x.n}`:x.k==='batt'?'Début du battement':'Fin de service';
function dstate(s,P,D){
 const nowS=(Date.now()-at(s.day,'00:00').getTime())/1000,nowM=nowS/60,cur=P.st[D.n]||null,prev=D.n>0?P.st[D.n-1]:null;
 const pan=mv(prev)?prev:(P.st.slice(D.n).find(mv)||null);
 let idx=0;if(pan&&pan===prev)pan.stops.forEach((q,i)=>{if(q.t<=nowM)idx=i});
 let txt='',lbl='';
 if(cur){const x=cur.a*60-nowS,a=Math.abs(Math.round(x)),h=Math.floor(a/3600),m=Math.floor(a%3600/60);txt=(x<0?'+':'')+(h?h+':':'')+String(m).padStart(2,'0')+':'+String(a%60).padStart(2,'0');lbl=x<0?'de retard : '+btnOf(cur).toLowerCase():'avant : '+btnOf(cur).toLowerCase()}
 return{nowM,cur,prev,pan,idx,txt,lbl};
}

 let b;const npend=Object.values(PR).filter(p=>!p.approved).length;
 if(adm==='lines')b=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><p class="sub" style="margin:0">${L.length} lignes</p><button class="btn p" onclick="lineDlg()">Ajouter une ligne</button></div>`+L.map(x=>`<div class="sv" style="cursor:default">${lb(x.code)}<div class="i"><b>${esc(x.terminus_a||'?')} ⇄ ${esc(x.terminus_b||'?')}</b><small>${ST.filter(s=>s.line_code===x.code).length} arrêts intermédiaires · course ${trj(x)[0]} min · repos ${trj(x)[1]} min</small></div><button class="btn" onclick="lineDlg('${esc(x.code)}')">Modifier</button></div>`).join('');
 else if(adm==='services'){const size=100,pageCount=Math.max(1,Math.ceil(SV.length/size));svcPage=Math.min(svcPage,pageCount-1);const shown=SV.slice(svcPage*size,(svcPage+1)*size);b=`<div class="row" style="justify-content:space-between;margin-bottom:8px"><p class="sub" style="margin:0">${SV.length.toLocaleString('fr-FR')} services · page ${svcPage+1}/${pageCount}</p><button class="btn p" onclick="svcDlg()">Ajouter un service</button></div>`+shown.map(s=>`<div class="sv" style="cursor:default">${lb(s.line_code)}<div class="i"><b>Service ${esc(s.id)}</b> · ${fd(s.day)}<small>${hm(s.start_time)} – ${hm(s.end_time)} · ${s.driver_id&&PR[s.driver_id]?esc(PR[s.driver_id].prenom+' '+PR[s.driver_id].nom):'À pourvoir'} · ${esc(vehText(s)||'Véhicule non affecté')}</small></div><button class="btn" onclick="svcDlg('${esc(s.id)}')">Modifier</button></div>`).join('')+`<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" data-sp="-1" ${svcPage===0?'disabled':''}>Précédent</button><span class="mu">${(svcPage*size+1).toLocaleString('fr-FR')}–${Math.min((svcPage+1)*size,SV.length).toLocaleString('fr-FR')} sur ${SV.length.toLocaleString('fr-FR')}</span><button class="btn" data-sp="1" ${svcPage>=pageCount-1?'disabled':''}>Suivant</button></div>`;}
 else if(adm==='fleet')b=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><b>${VEH.length} véhicules au parc</b><p class="sub" style="margin:2px 0 0">Affectations calculées selon les lignes, les horaires et les disponibilités simultanées.</p></div><button class="btn p" id="autoFleet">Affecter automatiquement</button></div>`+VEH.map(v=>`<div class="sv" style="cursor:default"><span class="ln">${esc(v.fleet_number)}</span><div class="i"><b>${esc(v.model)}</b><small>${esc(v.operator)} · ${esc(v.category)}${v.length_m?' · '+esc(v.length_m)+' m':''}${v.doors?' · '+esc(v.doors)+' portes':''}${v.active?'':' · Non disponible'}</small></div></div>`).join('');
 else if(adm==='pending'){const w=Object.values(PR).filter(p=>!p.approved);b=w.length?w.map(p=>`<div class="sv" style="cursor:default"><div class="i"><b>${esc(p.prenom)} ${esc(p.nom)}</b><small>Matricule : ${esc(p.matricule)}</small></div><button class="btn p" data-ok="${p.id}">Valider</button><button class="btn" data-del="${p.id}" style="color:var(--rd)">Refuser</button></div>`).join(''):'<p class="sub">Aucun compte en attente.</p>'}
 else b=Object.values(PR).filter(p=>p.approved).map(p=>`<div class="sv" style="cursor:default"><div class="i"><b>${esc(p.prenom)} ${esc(p.nom)}</b><small>${esc(p.matricule)} · ${p.role==='admin'?'administrateur':'conducteur'}</small></div>${p.id===me.id?'':`<button class="btn" data-role="${p.id}" data-to="${p.role==='admin'?'driver':'admin'}">${p.role==='admin'?'Retirer admin':'Passer admin'}</button><button class="btn" data-del="${p.id}" style="color:var(--rd)">Supprimer</button>`}</div>`).join('');
 const T=(k,t)=>`<button data-a="${k}" class="${adm===k?'on':''}">${t}</button>`;
 return `<h1>Administration</h1><p class="sub">Lignes, services, parc automobile et conducteurs.</p><div class="tabs" id="at">${T('lines','Lignes')}${T('services','Services')}${T('fleet','Parc véhicules')}${T('pending','En attente ('+npend+')')}${T('users','Conducteurs existants')}</div><div class="card">${b}</div>`;
}


function lineDlg(code){
 const x=code?L.find(y=>y.code===code):{code:'',bg:'#3b82f6',fg:'#111111',terminus_a:'',terminus_b:''};
 const names=code?ST.filter(s=>s.line_code===code).map(s=>s.name).join('\n'):'';
 dlg(`<h2>${code?'Modifier la ligne '+esc(code):'Ajouter une ligne'}</h2><form id="lf"><div class="row"><label>Code<br><input id="l1" value="${esc(x.code)}" placeholder="ex. L7"></label><label>Fond<br><input id="l2" type="color" value="${esc(x.bg)}"></label><label>Texte<br><input id="l3" type="color" value="${esc(x.fg)}"></label></div><div class="two"><label>Terminus de départ<input id="l4" value="${esc(x.terminus_a)}" style="width:100%"></label><label>Terminus d’arrivée<input id="l5" value="${esc(x.terminus_b)}" style="width:100%"></label></div><div class="two"><label>Durée d’une course (min)<input id="l7" type="number" min="1" value="${trj(x)[0]}" style="width:100%"></label><label>Repos au terminus (min)<input id="l8" type="number" min="0" value="${trj(x)[1]}" style="width:100%"></label></div><label>Arrêts intermédiaires (un par ligne, dans l’ordre)<textarea id="l6">${esc(names)}</textarea></label><p class="err" id="le" role="alert"></p><div class="row" style="justify-content:flex-end">${code?'<button type="button" class="btn" id="ld" style="color:var(--rd);margin-right:auto">Supprimer</button>':''}<button type="button" class="btn" onclick="close()">Annuler</button><button class="btn p">Enregistrer</button></div></form>`);
 const er=m=>$('#le').textContent=m;
 $('#lf').onsubmit=async e=>{e.preventDefault();
  const c=$('#l1').value.replace(/[^A-Za-z0-9-]/g,'').toUpperCase();
  if(!c)return er('Saisis un code de ligne.');
  if(c!==code&&L.some(y=>y.code===c))return er('Cette ligne existe déjà.');
  const cm=parseInt($('#l7').value),rm=parseInt($('#l8').value);
  if(!(cm>=1)||!(rm>=0))return er('Saisis une durée de course (1 min minimum) et un repos (0 min minimum).');
  const o={code:c,bg:$('#l2').value,fg:$('#l3').value,terminus_a:$('#l4').value.trim(),terminus_b:$('#l5').value.trim(),course_min:cm,repos_min:rm};
  let r=await(code&&c!==code?sb.from('lines').update(o).eq('code',code):sb.from('lines').upsert(o));
  if(r.error)return er(r.error.message);
  r=await sb.from('stops').delete().eq('line_code',c);if(r.error)return er(r.error.message);
  const n=$('#l6').value.split('\n').map(v=>v.trim()).filter(Boolean);
  if(n.length){r=await sb.from('stops').insert(n.map((name,i)=>({line_code:c,pos:i+1,name})));if(r.error)return er(r.error.message)}
  close();await load();render();
 };
 const d=$('#ld');if(d)twice(d,async()=>{if(await act(sb.from('lines').delete().eq('code',code)))close()});
}
function svcDlg(id){
 const s=id?SV.find(x=>x.id===id):{id:'',line_code:L[0]?L[0].code:'',day:today(),start_time:'08:00',end_time:'12:00',detail:'Dépôt · 1 tour',driver_id:null};
 dlg(`<h2>${id?'Modifier':'Ajouter'} un service</h2><form id="sf"><div class="row"><label>Numéro<br><input id="s1" value="${esc(s.id)}" ${id?'readonly':''}></label><label>Ligne<br><select id="s2">${L.map(x=>`<option ${x.code===s.line_code?'selected':''}>${esc(x.code)}</option>`).join('')}</select></label><label>Jour<br><input id="s3" type="date" value="${esc(s.day)}"></label></div><div class="row"><label>Début<br><input id="s4" type="time" value="${hm(s.start_time)}"></label><label>Fin<br><input id="s5" type="time" value="${hm(s.end_time)}"></label></div><label>Détail<input id="s6" value="${esc(s.detail)}" style="width:100%"></label><label>Conducteur<br><select id="s7"><option value="">À pourvoir</option>${Object.values(PR).filter(p=>p.approved).map(p=>`<option value="${p.id}" ${p.id===s.driver_id?'selected':''}>${esc(p.prenom+' '+p.nom)}</option>`).join('')}</select></label><label>Véhicule(s) affecté(s) <span class="mu">(Ctrl ou Cmd pour plusieurs véhicules)</span><br><select id="s8" multiple size="5" style="width:100%">${VEH.filter(v=>v.active).map(v=>`<option value="${v.fleet_number}" ${(s.vehicle_numbers||[]).includes(v.fleet_number)?'selected':''}>${esc(v.fleet_number+' · '+v.model)}</option>`).join('')}</select></label><p class="err" id="se" role="alert"></p><div class="row" style="justify-content:flex-end">${id?'<button type="button" class="btn" id="sd" style="color:var(--rd);margin-right:auto">Supprimer</button>':''}<button type="button" class="btn" onclick="close()">Annuler</button><button class="btn p">Enregistrer</button></div></form>`);
 const er=m=>$('#se').textContent=m;
 $('#sf').onsubmit=async e=>{e.preventDefault();
  const n=$('#s1').value.replace(/[^A-Za-z0-9-]/g,'');
  if(!n)return er('Renseigne un numéro de service.');
  if(!$('#s2').value)return er('Crée d’abord une ligne.');
  const prefix=$('#s2').value.startsWith('NT')?'NT':'DC';
  const expected=prefix+$('#s2').value+'-';
  if(!id&&!n.startsWith(expected))return er(`Le numéro doit commencer par ${expected}<n°service> (ex. ${expected}1-YYMMDD).`);
  if(!id&&SV.some(x=>x.id===n))return er('Ce numéro existe déjà.');
  const r=await sb.from('services').upsert({id:n,line_code:$('#s2').value,day:$('#s3').value,start_time:$('#s4').value,end_time:$('#s5').value,detail:$('#s6').value.trim(),driver_id:$('#s7').value||null,vehicle_numbers:[...$('#s8').selectedOptions].map(o=>o.value)});
  if(r.error)return er(r.error.message);
  const updated={id:n,line_code:$('#s2').value,day:$('#s3').value,start_time:$('#s4').value,end_time:$('#s5').value,detail:$('#s6').value.trim(),driver_id:$('#s7').value||null,vehicle_numbers:[...$('#s8').selectedOptions].map(o=>o.value)};
  const index=SV.findIndex(x=>x.id===n);if(index>=0)SV[index]=updated;else SV.push(updated);
  close();render();toast('Service enregistré.',true);
 };
 const d=$('#sd');if(d)twice(d,async()=>{if(await act(sb.from('services').delete().eq('id',id)))close()});
}

function sheet(id){const s=SV.find(x=>x.id===id);if(!s)return false;$('#sheet').innerHTML=sheetHTML(s);return true}
function printSheet(id){if($('#dlg').open)close();if(!sheet(id))return;document.body.classList.add('ps');setTimeout(()=>window.print(),60)}
function pendingView(){
 document.body.classList.remove('in');$('#nav').style.display='none';
 $('#app').innerHTML=`<div class="au card"><h1>Compte en attente</h1><p class="sub">Bonjour ${esc(me.prenom)}, ton compte doit être validé par un administrateur avant que tu puisses accéder à LogiRide. Cette page se met à jour toute seule dès que c’est fait.</p><div class="row"><button class="btn p" id="chk">Vérifier maintenant</button><button class="btn" id="out">Se déconnecter</button></div></div>`;
 $('#app').insertAdjacentHTML('beforeend',FOOT);
 $('#chk').onclick=()=>enter(me.id);
 $('#out').onclick=()=>{me=null;sb.auth.signOut().then(render)};
}
function profil(){
 const h=hours();
 return `<h1>Mon compte LogiRide</h1><p class="sub">Ces informations sont visibles de l’équipe et de l'administration LogiRide.</p><div class="stats" style="max-width:480px"><div><small>Ce mois-ci</small><b>${fh(h.mois)}</b></div><div><small>Total effectué</small><b>${fh(h.total)}</b></div><div><small>À venir</small><b>${fh(h.venir)}</b></div></div><div class="card" style="max-width:480px"><form id="pf"><div class="two"><label>Prénom<input id="p1" value="${esc(me.prenom)}" style="width:100%"></label><label>Nom<input id="p2" value="${esc(me.nom)}" style="width:100%"></label></div><label>Matricule<input id="p3" value="${esc(me.matricule)}" style="width:100%" ${me.role==='admin'?'':'readonly'}></label>${me.role==='admin'?'':'<p class="sub" style="margin:-4px 0 12px;font-size:13px">Le matricule ne peut être modifié que par un administrateur.</p>'}<p class="sub" style="margin:0 0 12px">Rôle : ${me.role==='admin'?'administrateur':'conducteur'}</p><p class="err" id="pm" role="alert"></p><button class="btn p">Enregistrer</button></form></div>`;
}
function render(){
 if(!me){authView();return}
 if(!me.approved){pendingView();return}
 const r=view();
 if(r==='quitter'){me=null;sb.auth.signOut().then(()=>{location.hash='journee';render()});return}
 const v=r.startsWith('s-')?'service':r.startsWith('drive-')?'drive':(NAV.some(n=>n[0]===r)||(r==='admin'&&me.role==='admin')||r==='profil')?r:'journee';
 nav(v==='service'||v==='drive'?'services':v);$('#app').innerHTML=({journee,services,planning,heures,equipe,classement,messages,admin,profil,service,drive})[v]();
 if(v!=='drive')$('#app').insertAdjacentHTML('beforeend',FOOT);
 document.querySelectorAll('.sv[data-id],.chip[data-id],.js[data-id]').forEach(e=>{e.onclick=()=>detail(e.dataset.id);e.onkeydown=k=>{if(k.key==='Enter')e.click()}});
 document.querySelectorAll('.tabs button[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
 document.querySelectorAll('#at button').forEach(b=>b.onclick=()=>{adm=b.dataset.a;if(adm==='services')svcPage=0;render()});
 document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{svcPage+=Number(b.dataset.sp);render()});
  const af=$('#autoFleet');if(af)af.onclick=()=>{if(confirm('Recalculer les affectations de véhicules pour tous les services ? Les affectations actuelles seront remplacées.'))autoFleet()};
 document.querySelectorAll('[data-mp]').forEach(b=>b.onclick=()=>{pmo+=+b.dataset.mp;render()});
 document.querySelectorAll('[data-mh]').forEach(b=>b.onclick=()=>{hmo+=+b.dataset.mh;render()});
 document.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{omo+=+b.dataset.mo;render()});
 document.querySelectorAll('[data-mr]').forEach(b=>b.onclick=()=>{rmo+=+b.dataset.mr;render()});
 document.querySelectorAll('[data-pr]').forEach(b=>b.onclick=e=>{e.stopPropagation();printSheet(b.dataset.pr)});
 document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>sact(b.dataset.act,b.dataset.id));
 if(v==='drive')bindDrive();
 const cb=$('#csv');if(cb)cb.onclick=csv;const pb=$('#prt');if(pb)pb.onclick=()=>window.print();
 document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>act(sb.from('profiles').update({role:b.dataset.to}).eq('id',b.dataset.role)));
 document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>act(sb.from('profiles').update({approved:true}).eq('id',b.dataset.ok)));
 document.querySelectorAll('[data-del]').forEach(b=>twice(b,()=>act(sb.rpc('admin_delete_user',{uid:b.dataset.del}))));
 const f=$('#fl');if(f)f.onchange=()=>{fl=f.value;render()};
 const pf=$('#pf');if(pf)pf.onsubmit=async e=>{e.preventDefault();const o={prenom:$('#p1').value.trim(),nom:$('#p2').value.trim()};if(me.role==='admin')o.matricule=$('#p3').value.trim().toUpperCase();if(!o.prenom||!o.nom||(me.role==='admin'&&!o.matricule)){$('#pm').textContent='Renseigne ton prénom, ton nom et ton matricule.';return}const{error}=await sb.from('profiles').update(o).eq('id',me.id);if(error){$('#pm').textContent=error.message;return}Object.assign(me,o);await load();render();toast('Profil enregistré.',1)};
 const mf=$('#mf');if(mf){paintMsgs();mf.onsubmit=async e=>{e.preventDefault();const i=$('#mi'),t=i.value.trim();if(!t)return;
  const{error}=await sb.from('messages').insert({author_id:me.id,author_name:(me.prenom+' '+me.nom).trim(),body:t,important:!!($('#mx')&&$('#mx').checked)});
  if(error)toast(error.message);else i.value=''}}
}

let tk=0;
function tick(){
 const n=new Date(),t=n.toLocaleTimeString('fr-FR'),c=$('#clock');
 if(me&&me.approved&&view().startsWith('drive-'))driveTick();
 if(c)c.innerHTML='<b>'+t.slice(0,5)+'<i style="font-size:17px;font-weight:600;color:var(--mu);font-style:normal">'+t.slice(5)+'</i></b><span>'+n.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</span>';
 tk++;if(me&&!me.approved&&tk%30===0)enter(me.id);
 if(tk%60===0&&me&&['journee','services','planning','heures','equipe','classement','profil'].includes(view())&&!$('#dlg').open&&!document.activeElement.matches('input,select,textarea'))render();
}
tick();setInterval(tick,1000);
document.addEventListener('keydown',e=>{if(me&&view().startsWith('drive-')&&e.target===document.body&&(e.key===' '||e.key==='Enter')){e.preventDefault();dvalid()}});
window.addEventListener('afterprint',()=>document.body.classList.remove('ps'));
window.addEventListener('hashchange',render);
sb.auth.getSession().then(({data})=>data.session?enter(data.session.user.id):render());
</script>
</body>
</html>
